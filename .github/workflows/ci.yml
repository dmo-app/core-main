# CI do Core: em cada push e pull request.
#   linux:   motor + dominio (sem a app JUCE), testes "merge". Rapido e barato; apanha codigo que so compila no MSVC.
#   windows: a build completa (app, instalador, plugins de teste) e todos os testes, incluindo o self-test da app.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCORE_BUILD_APP=OFF
      - name: Compilar
        run: cmake --build build --parallel 4
      - name: Testes (merge)
        run: ctest --test-dir build -L merge --output-on-failure --timeout 600
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel 4
      - name: Testes (merge)
        run: ctest --test-dir build -L merge --output-on-failure --timeout 600
      - name: Self-test da app (desktop)
        run: ctest --test-dir build -L desktop --output-on-failure --timeout 900
      - name: Guardar o resultado do self-test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: build/tests/self-test.png
          if-no-files-found: ignore
